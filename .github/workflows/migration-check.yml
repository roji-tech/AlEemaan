name: Check migrations

# On a pull request that touches the schema or the migrations: validate the schema, and check that the migrations produce exactly the schema (no drift). Uses a throwaway
# Postgres service as the shadow database. It reads no secret and touches no real database.
on:
  pull_request:
    branches: [dev, master, prod]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema/**"

permissions:
  contents: read

jobs:
  check:
    name: Validate schema and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
        run: pnpm exec prisma validate
      # Exits non-zero when the schema has a change that no migration makes (or a migration makes a change the schema lacks).
      - name: The migrations produce the schema
        run: >-
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema
          --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow
          --exit-code
