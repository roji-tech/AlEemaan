name: Migrate staging

# `master` is staging: a push that touches the schema or the migrations applies the pending migrations to the staging database. Vercel builds the same push, so a
# migration must be additive (the old code runs on the new schema for a moment). Can also be run by hand.
on:
  push:
    branches: [master]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema/**"
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate the staging database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The DIRECT address (a pooler cannot hold the lock `migrate deploy` takes), from the `staging` GitHub Environment's secret (Settings, Environments, staging).
      - name: Check the address
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::The DATABASE_URL secret is not set on the staging environment."; exit 1; fi
          case "$DATABASE_URL" in *-pooler*) echo "::error::DATABASE_URL is a pooled address; migrations need the direct one."; exit 1;; esac
      - name: prisma migrate status (before)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma migrate status
      - name: prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate:deploy
      # Must end with "Database schema is up to date!".
      - name: prisma migrate status (after)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma migrate status
